name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Validate production configuration
        shell: bash
        env:
          VITE_LIFF_ID: ${{ vars.VITE_LIFF_ID }}
          VITE_SYNC_URL: ${{ vars.VITE_SYNC_URL }}
          VITE_MOCK_LIFF: ${{ vars.VITE_MOCK_LIFF }}
        run: |
          test -n "$VITE_SYNC_URL" || { echo "::error::Missing VITE_SYNC_URL"; exit 1; }
          case "$VITE_MOCK_LIFF" in
            true)
              echo "Mock LIFF mode enabled"
              ;;
            false)
              test -n "$VITE_LIFF_ID" || { echo "::error::Missing VITE_LIFF_ID"; exit 1; }
              test "$VITE_LIFF_ID" != "2000000000-AbCdEfGh" || { echo "::error::Placeholder LIFF ID is not allowed in real mode"; exit 1; }
              ;;
            *)
              echo "::error::VITE_MOCK_LIFF must be true or false"
              exit 1
              ;;
          esac

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          VITE_LIFF_ID: ${{ vars.VITE_LIFF_ID }}
          VITE_SYNC_URL: ${{ vars.VITE_SYNC_URL }}
          # ค่า default เป็น 'false' (fail-safe) — production ต้องไม่รัน mock โดยไม่ตั้งใจ
          # ตั้งจริงที่ Settings → Variables: VITE_MOCK_LIFF=false, VITE_LIFF_ID=<LIFF ID จริง>
          VITE_MOCK_LIFF: ${{ vars.VITE_MOCK_LIFF }}

      - name: Add 404.html (SPA fallback)
        run: cp dist/index.html dist/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
